services:

  backend:
    build:
      context: ./server
    container_name: automation-backend
    restart: unless-stopped
    env_file:
      - ./server/.env
    ports:
      - "127.0.0.1:5000:5000"

  frontend:
    build:
      context: ./client
      args:
        NEXT_PUBLIC_API_URL: /api/v1
        NEXT_PUBLIC_SOCKET_URL: /socket.io
    container_name: automation-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend